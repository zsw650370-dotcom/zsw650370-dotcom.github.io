name: Publish legal library
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir public && tar -xzf site.tar.gz -C public
      - name: Apply verified reading UI base
        run: |
          cat ui-base-reading-20261012-1.tar.b64 ui-base-reading-20261012-2.tar.b64 ui-base-reading-20261012-3.tar.b64 ui-base-reading-20261012-4.tar.b64 ui-base-reading-20261012-5.tar.b64 ui-base-reading-20261012-6.tar.b64 ui-base-reading-20261012-7.tar.b64 ui-base-reading-20261012-8.tar.b64 ui-base-reading-20261012-9.tar.b64 ui-base-reading-20261012-10.tar.b64 ui-base-reading-20261012-11.tar.b64 ui-base-reading-20261012-12.tar.b64 ui-base-reading-20261012-13.tar.b64 ui-base-reading-20261012-14.tar.b64 ui-base-reading-20261012-15.tar.b64 ui-base-reading-20261012-16.tar.b64 ui-base-reading-20261012-17.tar.b64 ui-base-reading-20261012-18.tar.b64 | base64 --decode > /tmp/reading-ui-base.tar.gz
          echo "7b4ee2608e494558281901fc43386e4593a1b343f1d3a8d7617e50bc256ce22a  /tmp/reading-ui-base.tar.gz" | sha256sum --check
          tar -xzf /tmp/reading-ui-base.tar.gz -C public
      - name: Apply verified catalogue cleanup
        run: |
          base64 --decode ui-reading-catalogue-fix-20261012.tar.b64 > /tmp/reading-catalogue-fix.tar.gz
          echo "8bd452fb74f5f2a9b26b9498cc24ea3a90612fb739795ee1a6c1c1ccfd9cb880  /tmp/reading-catalogue-fix.tar.gz" | sha256sum --check
          tar -xzf /tmp/reading-catalogue-fix.tar.gz -C public
      - name: Apply newly verified laws overlay
        run: |
          cat laws-overlay-5745-reading-1.tar.b64 laws-overlay-5745-reading-2.tar.b64 laws-overlay-5745-reading-3.tar.b64 laws-overlay-5745-reading-4.tar.b64 | base64 --decode > /tmp/laws-overlay.tar.gz
          echo "20b1b7ba0aeb2c90f0841c01e1a204050bacaddd175fc2c5490c86dad64066c1  /tmp/laws-overlay.tar.gz" | sha256sum --check
          tar -xzf /tmp/laws-overlay.tar.gz -C public
      - name: Apply verified complete UI redesign 20261024
        run: |
          cat ui-redesign-20261024-1.tar.b64 ui-redesign-20261024-2.tar.b64 ui-redesign-20261024-3.tar.b64 ui-redesign-20261024-4.tar.b64 ui-redesign-20261024-5.tar.b64 ui-redesign-20261024-6.tar.b64 ui-redesign-20261024-7.tar.b64 ui-redesign-20261024-8.tar.b64 ui-redesign-20261024-9.tar.b64 ui-redesign-20261024-10.tar.b64 ui-redesign-20261024-11.tar.b64 | base64 --decode > /tmp/ui-redesign.tar.gz
          echo "e49a5dc1639740cd850d35a22e0e79917bbd9255016c65ebcd437a14644b3dd5  /tmp/ui-redesign.tar.gz" | sha256sum --check
          tar -xzf /tmp/ui-redesign.tar.gz -C public
      - name: Refine mobile search results spacing
        run: |
          base64 --decode ui-search-mobile-polish-20261024.tar.b64 > /tmp/ui-search-polish.tar.gz
          echo "799ba9d3dc12db50fa21d94bfdfafd6b3c9b19f792168ae071e2c12b47ff63eb  /tmp/ui-search-polish.tar.gz" | sha256sum --check
          tar -xzf /tmp/ui-search-polish.tar.gz -C public
      - name: Apply verified color and typography polish
        run: |
          base64 --decode ui-visual-polish-20261024.tar.b64 > /tmp/visual-polish.tar.gz
          echo "314e54003ccfcf92667d642703a7ddb4d1416063f38e0704b987c39338ec4881  /tmp/visual-polish.tar.gz" | sha256sum --check
          tar -xzf /tmp/visual-polish.tar.gz -C public
      - name: Apply verified black and white palette
        run: |
          base64 --decode ui-monochrome-20261024.tar.b64 > /tmp/monochrome.tar.gz
          echo "72e2aec140566343fb8631f02d4784bf77d672a0d804c0d11e6cb8be55614ec2  /tmp/monochrome.tar.gz" | sha256sum --check
          tar -xzf /tmp/monochrome.tar.gz -C public
      - name: Remove requested catalogue progress section
        run: |
          base64 --decode ui-remove-catalogue-progress-20261024.tar.b64 > /tmp/catalogue-cleanup.tar.gz
          echo "95b127d22f4fe583b4ca2790250cb4af5a4581e846f8316ecafe2f018d60982f  /tmp/catalogue-cleanup.tar.gz" | sha256sum --check
          tar -xzf /tmp/catalogue-cleanup.tar.gz -C public
      - name: Apply reviewed plain language examples batch 001
        run: |
          base64 --decode example-review-20261024-001.tar.b64 > /tmp/example-review-001.tar.gz
          echo "ba98502e1cfa53b0138321e225deff65c2930a2fd7aec7c7aabe6de6accae050  /tmp/example-review-001.tar.gz" | sha256sum --check
          tar -xzf /tmp/example-review-001.tar.gz -C public
      - name: Apply reviewed plain language examples batch 002
        run: |
          base64 --decode example-review-20261024-002.tar.b64 > /tmp/example-review-002.tar.gz
          echo "439bc3584f34195cee2bb483cd8cb01b7c4b252491d40a9a51bb5a7942d99a7a  /tmp/example-review-002.tar.gz" | sha256sum --check
          tar -xzf /tmp/example-review-002.tar.gz -C public
      - name: Apply reviewed plain language examples batch 003
        run: |
          base64 --decode example-review-20261024-003.tar.b64 > /tmp/example-review-003.tar.gz
          echo "93ebd4aa1fc7e03f69c4c08e1e0f4981d379eb692ee5cf7e2bc2d1829d5adac8  /tmp/example-review-003.tar.gz" | sha256sum --check
          tar -xzf /tmp/example-review-003.tar.gz -C public
      - name: Apply reviewed plain language examples batch 004
        run: |
          base64 --decode example-review-20261024-004.tar.b64 > /tmp/example-review-004.tar.gz
          echo "53f7faaf47971870f671d93ca25a8eea893da5e3d826d61bb9b82e22e1c736fe  /tmp/example-review-004.tar.gz" | sha256sum --check
          tar -xzf /tmp/example-review-004.tar.gz -C public
      - name: Apply reviewed plain language examples batch 005
        run: |
          base64 --decode example-review-20261024-005.tar.b64 > /tmp/example-review-005.tar.gz
          echo "a836ccaf5515e45330c3a7856333015e39a07d1ed43beabf11ddc153ad8706ee  /tmp/example-review-005.tar.gz" | sha256sum --check
          tar -xzf /tmp/example-review-005.tar.gz -C public
      - name: Apply reviewed plain language examples batch 006
        run: |
          base64 --decode example-review-20261024-006.tar.b64 > /tmp/example-review-006.tar.gz
          echo "4e382656098c0e3b35152390180a3780926f7a93d06d24d2b1113c4d65614720  /tmp/example-review-006.tar.gz" | sha256sum --check
          tar -xzf /tmp/example-review-006.tar.gz -C public
      - name: Apply reviewed plain language examples batch 007
        run: |
          base64 --decode example-review-20261024-007.tar.b64 > /tmp/example-review-007.tar.gz
          echo "2bc7e5c2db02c88a15803f627c296f7dad1ab48bdd89df7b51123bf0648717ad  /tmp/example-review-007.tar.gz" | sha256sum --check
          tar -xzf /tmp/example-review-007.tar.gz -C public
      - name: Apply reviewed plain language examples batch 008
        run: |
          base64 --decode example-review-20261024-008.tar.b64 > /tmp/example-review-008.tar.gz
          echo "edf8abd811bef9dce3823ff80db5f244fec17f7015858bc2c259554809eefa4c  /tmp/example-review-008.tar.gz" | sha256sum --check
          tar -xzf /tmp/example-review-008.tar.gz -C public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
