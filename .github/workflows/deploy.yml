name: Publish legal library
on:
  push:
    branches: [main]
    paths:
      - laws-overlay-3374-criminal-ecology-maritime-4.tar.b64
      - .github/workflows/deploy.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir public && tar -xzf site.tar.gz -C public
      - name: Apply complete laws overlay
        run: |
          cat laws-overlay-3374-criminal-ecology-maritime-1.tar.b64 laws-overlay-3374-criminal-ecology-maritime-2.tar.b64 laws-overlay-3374-criminal-ecology-maritime-3.tar.b64 laws-overlay-3374-criminal-ecology-maritime-4.tar.b64 | base64 --decode > /tmp/laws-overlay.tar.gz
          echo "13e4afd172cef0702adc74b0ce0716a18e96f7097edab568074c7a37ad035bef  /tmp/laws-overlay.tar.gz" | sha256sum --check
          tar -xzf /tmp/laws-overlay.tar.gz -C public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment